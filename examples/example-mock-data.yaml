            workspace_path: "workspace/my-org-order-processing"
            tech_stack: ["typescript", "node"]
            branch: "fix/PROJ-7777-multi-currency-total"

      bug_investigation:
        bug_investigation:
          classification: "Logic error"
          root_cause: "Currency lookup uses project default instead of order currency"
          affected_files:
            - "src/order/totalCalculator.ts"

      planning:
        plan:
          subtasks:
            - id: 1
              title: "Fix currency lookup"
              description: "Use order.totalPrice.currencyCode"
              files: ["src/order/totalCalculator.ts"]
            - id: 2
              title: "Add regression test"
              description: "Multi-currency order total test"
              files: ["tests/totalCalculator.test.ts"]

      branch_setup:
        branch_created:
          name: "fix/PROJ-7777-multi-currency-total"
          repos: ["my-org-order-processing"]

      implementation:
        commits:
          - hash: "xyz1111"
            message: "PROJ-7777: fix currency lookup in totalCalculator"
            files: ["src/order/totalCalculator.ts"]
          - hash: "xyz2222"
            message: "PROJ-7777: add multi-currency regression test"
            files: ["tests/totalCalculator.test.ts"]

      verification:
        verification_result:
          tests_passed: true
          lint_passed: true
          build_pass: true
          test_count: 8
          coverage: 91.2
        self_review_completed: true

      security_audit:
        security_report:
          critical: []
          high: []
          medium: []
          low: []

      pr_creation:
        pr_data:
          pr_id: "42002"
          url: "https://github.com/my-org/my-org-order-processing/pull/42002"
          title: "PROJ-7777: fix multi-currency order total"
        addendum_path: "memory/addendums/PROJ-7777.md"

      cleanup:
