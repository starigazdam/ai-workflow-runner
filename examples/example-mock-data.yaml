# Mock data for workflow dry-run.
# Maps each phase → the context keys it "produces".
# The mock runner injects these instead of calling real agents.
#
# Three scenarios: story (happy path), analysis, bug

scenarios:
  # ── Story / Task — full happy path ─────────────────────────────────────
  story:
    description: "Standard Story ticket — full implementation flow"
    phases:
      intake:
        jira_data:
          key: "PROJ-9999"
          summary: "Mock: add customer endpoint"
          issuetype: "Story"
          status: "In Progress"
          priority: "Medium"
          parent: null
          description: "Implement a new customer endpoint."
          assignee: "mock-user"
          comments: []
          acceptance_criteria_inferred:
            - "Endpoint returns 200 with customer data"
            - "Validation for missing customer ID"

      repo_resolver:
        repo_context:
          - name: "my-org-backend-services"
            short: "backend-services"
            workspace_path: "workspace/my-org-backend-services"
            tech_stack: ["typescript", "node"]
            branch: "feature/PROJ-9999-add-customer-endpoint"

      planning:
        plan:
          branch: "feature/PROJ-9999-add-customer-endpoint"
          subtasks:
            - id: 1
              title: "Add GetCustomer endpoint"
              description: "Create HTTP handler function"
              files: ["src/handlers/getCustomer.ts"]
            - id: 2
              title: "Add validation"
              description: "Input validation middleware"
              files: ["src/validation/customerValidator.ts"]
            - id: 3
              title: "Add unit tests"
              description: "Test endpoint and validator"
              files: ["tests/getCustomer.test.ts"]

      branch_setup:
        branch_created:
          name: "feature/PROJ-9999-add-customer-endpoint"
          repos: ["my-org-backend-services"]

      implementation:
        commits:
          - hash: "abc1234"
            message: "PROJ-9999: add GetCustomer endpoint"
            files: ["src/handlers/getCustomer.ts"]
          - hash: "def5678"
            message: "PROJ-9999: add input validation"
            files: ["src/validation/customerValidator.ts"]
          - hash: "ghi9012"
            message: "PROJ-9999: add unit tests"
            files: ["tests/getCustomer.test.ts"]

      verification:
        verification_result:
          tests_passed: true
          lint_passed: true
          build_pass: true
          test_count: 12
          coverage: 87.5
        self_review_completed: true

      security_audit:
        security_report:
          critical: []
          high: []
          medium:
            - "Informational: consider adding rate limiting"
          low: []

      pr_creation:
        pr_data:
          pr_id: "42001"
          url: "https://github.com/my-org/my-org-backend-services/pull/42001"
          title: "PROJ-9999: add customer endpoint"
        addendum_path: "memory/addendums/PROJ-9999.md"

      cleanup:
        improvement_proposals:
          - "Consider caching customer lookups"

  # ── Analysis ticket — stops after analysis phase ───────────────────────
  analysis:
    description: "Ticket in Analysis status — stops after producing analysis doc"
    phases:
      intake:
        jira_data:
          key: "PROJ-8888"
          summary: "Mock: investigate slow list loading"
          issuetype: "Task"
          status: "In Analysis"
          priority: "High"
          parent: null
          description: "List page takes 8s to load for large data sets."
          assignee: "mock-user"
          comments: []
          acceptance_criteria_inferred: []

      repo_resolver:
        repo_context:
          - name: "my-org-data-service"
            short: "data-service"
            workspace_path: "workspace/my-org-data-service"
            tech_stack: ["typescript", "node"]
            branch: "feature/PROJ-8888-investigate-slow-list"

      analysis:
        analysis_doc:
          title: "List Loading Performance Analysis"
          root_cause: "N+1 query in list item expansion"
          recommendation: "Batch API calls using GraphQL query"
          estimated_effort: "3 story points"

  # ── Bug ticket — includes bug investigation fork ───────────────────────
  bug:
    description: "Bug ticket — triggers bug_investigation routing fork"
    phases:
      intake:
        jira_data:
          key: "PROJ-7777"
          summary: "Mock: order total wrong for multi-currency"
          issuetype: "Bug"
          status: "In Progress"
          priority: "Critical"
          parent: null
          description: "Order total shows EUR when customer currency is USD."
          assignee: "mock-user"
          comments: ["Reported by customer support"]
